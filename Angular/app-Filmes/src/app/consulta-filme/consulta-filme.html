<section class="consulta-container">
    <h1>Consulta de Filmes</h1>

    <form class="busca-form" (ngSubmit)="buscarFilmes()">
        <input
            type="text"
            name="titulo"
            [(ngModel)]="termoBusca"
            placeholder="Digite o titulo do filme"
        />
        <button type="submit">Buscar</button>
    </form>

    @if (carregando()) {
        <p class="mensagem">Buscando filmes...</p>
    }

    @if (mensagem()) {
        <p class="mensagem">{{ mensagem() }}</p>
    }

    <div class="lista-filmes">
        @for (filme of filmes(); track filme.imdbID) {
            <article class="filme-card">
                @if (filme.Poster !== 'N/A') {
                    <img class="poster" [src]="filme.Poster" [alt]="'Poster de ' + filme.Title">
                } @else {
                    <div class="poster-sem-imagem">Sem poster</div>
                }

                <h2>{{ filme.Title }}</h2>
                <p>Ano: {{ filme.Year }}</p>
                <p>Tipo: {{ filme.Type }}</p>
            </article>
        }
    </div>
</section>
